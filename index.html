<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geliştirme Günlüğü & PR Blogu</title>
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    /* Blog Üst Başlık Alanı */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 48px 20px;
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
    }
    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    /* Ana İçerik Alanı */
    main {
      max-width: 760px;
      margin: 0 auto 60px auto;
      padding: 0 20px;
    }
    /* Blog Yazısı Kartı */
    article.post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    article.post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }
    /* Yazar ve Tarih Bilgisi */
    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .post-author img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .post-title {
      margin: 0 0 12px 0;
      font-size: 1.45rem;
      line-height: 1.3;
    }
    .post-title a {
      color: var(--text-main);
      text-decoration: none;
    }
    .post-title a:hover {
      color: var(--accent);
    }
    .post-excerpt {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0 0 20px 0;
      white-space: pre-line;
    }
    /* Alt Bilgi ve Etiketler */
    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 0.85rem;
    }
    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .tag-open { background: #dafbe1; color: #1a7f37; }
    .tag-merged { background: #fbefff; color: #8250df; }
    .tag-closed { background: #ffebe9; color: #cf222e; }
    .read-more {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .read-more:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>✍️ Geliştirme Günlüğü</h1>
    <p>Projedeki son güncellemeler, özellikler ve Pull Request notları</p>
  </header>

  <main id="blog-feed">
    <p style="text-align:center; color:#656d76;">Yazılar yükleniyor...</p>
  </main>

  <script>
    // KENDİ BİLGİLERİNİZLE GÜNCELLEYİN
    const owner = "dotnet";
    const repo = "efcore";

    fetch(`https://github.com/dotnet/efcore/pulls?q=is%3Apr+author%3Ailkertskn`)
      .then(res => {
        if (!res.ok) throw new Error("Repo bulunamadı veya API limiti doldu.");
        return res.json();
      })
      .then(prs => {
        const feed = document.getElementById("blog-feed");
        if (prs.length === 0) {
          feed.innerHTML = "<p style='text-align:center;'>Henüz yayınlanmış bir yazı (PR) bulunmuyor.</p>";
          return;
        }

        feed.innerHTML = prs.map(pr => {
          // PR açıklamasını blog özeti haline getir (ilk 240 karakter)
          const rawBody = pr.body ? pr.body.replace(/[#*`>]/g, '').trim() : "Bu güncelleme için detaylı açıklama eklenmemiş.";
          const excerpt = rawBody.length > 240 ? rawBody.substring(0, 240) + "..." : rawBody;

          // Durum etiketi belirleme (Açık, Birleştirildi veya Kapalı)
          let statusClass = "tag-open";
          let statusText = "İnceleniyor (Open)";
          if (pr.merged_at) {
            statusClass = "tag-merged";
            statusText = "Yayında (Merged)";
          } else if (pr.state === "closed") {
            statusClass = "tag-closed";
            statusText = "Kapatıldı (Closed)";
          }

          // GitHub etiketlerini (Labels) ekleme
          const labelsHtml = pr.labels.map(label => 
            `<span class="tag" style="background:#${label.color}22; color:#${label.color}; border: 1px solid #${label.color}55;">${label.name}</span>`
          ).join("");

          const dateStr = new Date(pr.created_at).toLocaleDateString('tr-TR', {
            year: 'numeric', month: 'long', day: 'numeric'
          });

          return `
            <article class="post-card">
              <div class="post-author">
                <img src="${pr.user.avatar_url}" alt="${pr.user.login}">
                <span><strong>${pr.user.login}</strong> • ${dateStr}</span>
              </div>
              <h2 class="post-title">
                <a href="${pr.html_url}" target="_blank">${pr.title}</a>
              </h2>
              <p class="post-excerpt">${excerpt}</p>
              <div class="post-footer">
                <div class="tags">
                  <span class="tag ${statusClass}">${statusText}</span>
                  ${labelsHtml}
                </div>
                <a class="read-more" href="${pr.html_url}" target="_blank">Detayları Oku →</a>
              </div>
            </article>
          `;
        }).join("");
      })
      .catch(err => {
        document.getElementById("blog-feed").innerHTML = `<p style="color:red; text-align:center;">Hata: ${err.message}</p>`;
      });
  </script>

</body>
</html>
