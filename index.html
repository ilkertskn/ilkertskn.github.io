

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geliştirme Günlüğü</title>

<style>
:root {
  --bg:#fafafa;
  --card:#fff;
  --text:#1f2328;
  --muted:#656d76;
  --accent:#0969da;
  --border:#e5e7eb;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}
header {
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:45px 20px;
  text-align:center;
  margin-bottom:35px;
}
header h1 { margin:0 0 10px; }
header p { color:var(--muted); margin:0; }
main {
  max-width:760px;
  margin:auto;
  padding:0 20px 60px;
}
.post-card {
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 2px 6px #00000008;
}
.post-author {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:14px;
  margin-bottom:15px;
}
.post-author img {
  width:32px;
  height:32px;
  border-radius:50%;
}
.post-title { font-size:21px; margin:0 0 12px; }
.post-title a { color:var(--text); text-decoration:none; }
.post-title a:hover { color:var(--accent); }
.post-excerpt {
  color:var(--muted);
  white-space:pre-line;
  overflow-wrap:anywhere;
}
.post-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
  padding-top:15px;
}
.tags { display:flex; flex-wrap:wrap; gap:7px; }
.tag {
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.tag-open { background:#dafbe1;color:#1a7f37; }
.tag-merged { background:#fbefff;color:#8250df; }
.tag-closed { background:#ffebe9;color:#cf222e; }
.read-more { color:var(--accent);text-decoration:none;font-weight:bold; }
.status { text-align:center;padding:25px;color:var(--muted); }
.error { color:#cf222e; }
button {
  display:block;
  margin:0 auto 25px;
  padding:11px 20px;
  background:var(--accent);
  color:white;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
@media(max-width:600px) {
  .post-card { padding:18px; }
}
</style>
</head>

<body>

<header>
  <h1>✍️ Geliştirme Günlüğü</h1>
  <p>Projeye katkılarım, özellikler ve Pull Request notları</p>
</header>

<main>

<button onclick="loadPRs()">↻ Yenile</button>

<div id="blog-feed">
  <p class="status">GitHub verileri yükleniyor...</p>
</div>

</main>

<script>
const OWNER = "dotnet";
const REPO = "efcore";
const USERNAME = "ilkertskn";
const YEAR = 2026;

const feed = document.getElementById("blog-feed");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function getStatus(pr) {
  if (pr.merged_at) {
    return ["tag-merged", "Birleştirildi (Merged)"];
  }
  if (pr.state === "closed") {
    return ["tag-closed", "Kapatıldı (Closed)"];
  }
  return ["tag-open", "İnceleniyor (Open)"];
}

function createCard(pr) {
  const [statusClass, statusText] = getStatus(pr);

  const description = (pr.body || "Açıklama bulunmuyor.")
    .replace(/[#*`>]/g, "")
    .trim()
    .substring(0, 240);

  const labels = (pr.labels || []).map(label => {
    const color = /^[0-9a-f]{6}$/i.test(label.color)
      ? label.color : "e5e7eb";

    return `
      <span class="tag"
        style="background:#${color}22;color:#${color}">
        ${escapeHTML(label.name)}
      </span>`;
  }).join("");

  return `
    <article class="post-card">

      <div class="post-author">
        <img src="${escapeHTML(pr.user.avatar_url)}"
             alt="${escapeHTML(pr.user.login)}">
        <span>
          <strong>${escapeHTML(pr.user.login)}</strong>
          • ${new Date(pr.created_at).toLocaleDateString("tr-TR")}
        </span>
      </div>

      <h2 class="post-title">
        <a href="${escapeHTML(pr.html_url)}"
           target="_blank" rel="noopener noreferrer">
          ${escapeHTML(pr.title)}
        </a>
      </h2>

      <p class="post-excerpt">${escapeHTML(description)}</p>

      <div class="post-footer">
        <div class="tags">
          <span class="tag ${statusClass}">${statusText}</span>
          ${labels}
        </div>

        <a class="read-more"
           href="${escapeHTML(pr.html_url)}"
           target="_blank" rel="noopener noreferrer">
          Detayları Oku →
        </a>
      </div>

    </article>`;
}

async function loadPRs() {
  feed.innerHTML = '<p class="status">GitHub API bağlantısı kuruluyor...</p>';

  try {
    let allPRs = [];
    let page = 1;
    let hasMore = true;

    while (hasMore) {
      const url = new URL(
        `https://api.github.com/repos/${OWNER}/${REPO}/pulls`
      );

      url.searchParams.set("state", "all");
      url.searchParams.set("per_page", "100");
      url.searchParams.set("page", page);
      url.searchParams.set("sort", "created");
      url.searchParams.set("direction", "desc");

      const response = await fetch(url.toString());

      if (!response.ok) {
        throw new Error(
          `GitHub API HTTP ${response.status}: ${response.statusText}`
        );
      }

      const prs = await response.json();

      allPRs = allPRs.concat(prs);

      hasMore = prs.length === 100;
      page++;

      // Gereksiz çok sayıda istek yapmamak için sınır
      if (page > 10) break;
    }

    const filteredPRs = allPRs.filter(pr => {
      const date = new Date(pr.created_at);

      return (
        pr.user.login.toLowerCase() === USERNAME.toLowerCase() &&
        date.getFullYear() === YEAR
      );
    });

    if (filteredPRs.length === 0) {
      feed.innerHTML = `
        <p class="status">
          ${YEAR} yılında bu kullanıcıya ait PR bulunamadı.
        </p>`;
      return;
    }

    feed.innerHTML = filteredPRs.map(createCard).join("");

  } catch (error) {
    console.error(error);

    feed.innerHTML = `
      <div class="status error">
        <h3>GitHub bağlantı hatası</h3>
        <p>${escapeHTML(error.message)}</p>
        <p>
          API adresini yeni sekmede test et:
          <br>
          <a href="https://api.github.com/repos/dotnet/efcore/pulls?per_page=1"
             target="_blank">
            GitHub API bağlantısını aç
          </a>
        </p>
      </div>`;
  }
}

loadPRs();
</script>

</body>
</html>
